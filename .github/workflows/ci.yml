name: ci

on:
  push:
    branches: [ main, master, develop, dev ]
    tags:     [ "v*", "[0-9]*.[0-9]*.[0-9]*" ]
  pull_request:
    branches: [ main, master, develop, dev ]
  workflow_dispatch:

# Default permissions are read-only; jobs that need to write (release) opt in.
permissions:
  contents: read

# A single in-flight run per branch. New pushes cancel older queued runs so
# CI doesn't pile up on rapid-fire commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # full history so deterministic builds embed a real commit

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Cache the NuGet HTTP cache + global packages folder. Keyed off the
      # central package versions file so a version bump invalidates the cache.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/packages*.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache HIDMaestro SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/hidmaestro
          key: hidmaestro-${{ hashFiles('build/HidMaestroSdk.props') }}

      - name: Restore
        run: dotnet restore GameFlow.sln --locked-mode

      - name: Build
        run: dotnet build GameFlow.sln --configuration Release --no-restore -warnaserror

      - name: Check localisation failures
        shell: pwsh
        run: ./scripts/Test-LocalizationChecks.ps1

      - name: Check SDK maintenance fixtures
        shell: pwsh
        run: ./scripts/Test-HidMaestroMaintenance.ps1

      - name: Test
        run: dotnet test --solution GameFlow.sln --configuration Release --no-build --report-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  browser-test:
    name: Browser input (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install test dependencies
        working-directory: tests/browser
        run: npm ci --ignore-scripts
      - name: Install browser
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: Test phone and OBS input
        working-directory: tests/browser
        env:
          GAMEFLOW_TEST_BROWSER: ${{ matrix.browser }}
        run: npm test

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [ build-test, browser-test ]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest, ext: zip    }
          - { rid: linux-x64, os: ubuntu-latest,  ext: tar.gz }
          - { rid: osx-arm64, os: macos-latest,   ext: tar.gz }
          - { rid: osx-x64,   os: macos-15-intel, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache HIDMaestro SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/hidmaestro
          key: hidmaestro-${{ hashFiles('build/HidMaestroSdk.props') }}

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/GameFlow.App/GameFlow.App.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -p:RestoreLockedMode=true \
            -p:Version=${GITHUB_REF_NAME#v} \
            -o publish/${{ matrix.rid }}

      - name: Include release documentation and dependency notices
        shell: pwsh
        run: ./scripts/Prepare-Release.ps1 -PublishDirectory publish/${{ matrix.rid }} -AssetsFile src/GameFlow.App/obj/project.assets.json

      - name: Package zip
        if: matrix.ext == 'zip'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          7z a -tzip "../../GameFlow-${GITHUB_REF_NAME}-${{ matrix.rid }}.zip" *

      - name: Package tar.gz
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          chmod +x GameFlow
          tar -czf "../../GameFlow-${GITHUB_REF_NAME}-${{ matrix.rid }}.tar.gz" *

      - name: Hash archive
        shell: pwsh
        run: |
          $archive = Get-Item "GameFlow-${env:GITHUB_REF_NAME}-${{ matrix.rid }}.${{ matrix.ext }}"
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          # The release verifier runs on Linux; use LF even on Windows.
          [IO.File]::WriteAllText("$($archive.FullName).sha256", "$hash  $($archive.Name)`n", [Text.UTF8Encoding]::new($false))

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GameFlow-${{ matrix.rid }}
          path: |
            GameFlow-*-${{ matrix.rid }}.${{ matrix.ext }}
            GameFlow-*-${{ matrix.rid }}.${{ matrix.ext }}.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: GameFlow-*
          path: artifacts

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 linux-x64 osx-arm64 osx-x64; do
            extension=tar.gz
            if [ "$rid" = win-x64 ]; then extension=zip; fi
            directory="artifacts/GameFlow-${rid}"
            archive="GameFlow-${GITHUB_REF_NAME}-${rid}.${extension}"
            test -s "${directory}/${archive}"
            test -s "${directory}/${archive}.sha256"
            (cd "$directory" && sha256sum --check --strict "${archive}.sha256")
          done
          count=$(find artifacts -type f | wc -l)
          if [ "$count" -ne 8 ]; then
            echo "::error::Expected four release archives and four checksum files; found $count files."
            exit 1
          fi

      # The tag's own notes, if CHANGELOG.md has a section for it. Kept
      # out of the release step so a missing or renamed section is a
      # visible failure in the log rather than a release that quietly ships
      # with nothing but an auto-generated commit list.
      - name: Extract release notes for this tag
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is required for a release."
            exit 1
          fi
          # Everything between this version's heading and the next one.
          awk -v tag="## ${GITHUB_REF_NAME}" '
            { sub(/\r$/, "") }
            $0 == tag        { capture = 1; next }
            /^## /           { if (capture) exit }
            capture          { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
            echo "Using CHANGELOG.md section for ${GITHUB_REF_NAME}."
          else
            echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section."
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # body_path supplies the curated notes; generate_release_notes
          # appends the commit and contributor list underneath them.
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: artifacts/**/*
